<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <header class="header">
      <h1 class="header-title visually-hidden">Todo Application</h1>
      <figure class="header-figure">
        <img class="header-img" src="./eisenhower-matrix.jpg">
      </figure>
      <aside class="header-aside">
        <a class="details" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
      </aside>
    </header>
    <main class="main">
      <section class="add-task-section">
        <h2 class="section-title">Add Item</h2>
        <form id="add-task-form" class="add-task-form">
          <input id="new-task" class="task" type="text">
          <button type="submit" class="button add">Add</button>
        </form>
      </section>
      <section class="todo-section">
        <h2 class="section-title">Todo</h2>
        <ul id="incomplete-tasks" class="list">
          <li class="list-item">
            <input type="checkbox" class="checkbox">
            <label class="task-label">Pay Bills</label>
            <input type="text" class="task">
            <button type="button" class="button edit">Edit</button>
            <button type="button" class="button delete">
              <img class="remove-img" src="./remove.svg">
            </button>
          </li>
          <li class="list-item edit-mode">
            <input type="checkbox" class="checkbox">
            <label class="task-label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task">
            <button type="button" class="button edit">Save</button>
            <button type="button" class="button delete">
              <img class="remove-img" src="./remove.svg">
            </button>
          </li>
        </ul>
      </section>
      <section class="completed-section">
        <h2 class="section-title">Completed</h2>
        <ul id="completed-tasks" class="list">
          <li class="list-item">
            <input type="checkbox" class="checkbox" checked>
            <label class="task-label">See the Doctor</label>
            <input type="text" class="task">
            <button type="button" class="button edit">Edit</button>
            <button type="button" class="button delete">
              <img class="remove-img" src="./remove.svg">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
