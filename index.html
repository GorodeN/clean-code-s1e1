<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <meta charset="utf-8">
    <meta
      name="viewport" 
      content="width=device-width, initial-scale=1"
    >
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css" media="screen">
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title visually-hidden">Todo Application</h1>
      <figure class="header__figure">
        <img
          class="header__image"
          src="./eisenhower-matrix.jpg"
          alt="The Eisenhower Matrix"
        >
      </figure>
      <aside class="header__aside">
        <a
          class="header__details-link" 
          href="https://goal-life.com/page/method/matrix-eisenhower"
        >
          Want more details?
        </a>
      </aside>
    </header>
    <main class="main">
      <section class="add-task">
        <h2 class="add-task__title">Add Item</h2>
        <form id="add-task-form" class="add-task__form">
          <input id="new-task" class="add-task__input" type="text">
          <button type="submit" class="button button--add">Add</button>
        </form>
      </section>
      <section class="tasks">
        <h2 class="tasks__title">Todo</h2>
        <ul id="incomplete-tasks" class="tasks__list">
          <li class="tasks__item">
            <input type="checkbox" class="tasks__checkbox">
            <label class="tasks__label">Pay Bills</label>
            <input type="text" class="tasks__input">
            <button type="button" class="button button--edit">Edit</button>
            <button type="button" class="button button--remove">
              <img
                class="tasks__remove-icon"
                src="./remove.svg"
                alt="Remove task"
              >
            </button>
          </li>
          <li class="tasks__item tasks__item--edit-mode">
            <input type="checkbox" class="tasks__checkbox">
            <label class="tasks__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="tasks__input">
            <button type="button" class="button button--edit">Save</button>
            <button type="button" class="button button--remove">
              <img
                class="tasks__remove-icon"
                src="./remove.svg"
                alt="Remove task"
              >
            </button>
          </li>
        </ul>
      </section>
      <section class="tasks tasks--completed">
        <h2 class="tasks__title">Completed</h2>
        <ul id="completed-tasks" class="tasks__list">
          <li class="tasks__item">
            <input type="checkbox" class="tasks__checkbox" checked>
            <label class="tasks__label">See the Doctor</label>
            <input type="text" class="tasks__input">
            <button type="button" class="button button--edit">Edit</button>
            <button type="button" class="button button--remove">
              <img
                class="tasks__remove-icon"
                src="./remove.svg"
                alt="Remove task"
              >
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
